name: Update Scoop manifests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scoop-manifests
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get Scoop core
        shell: pwsh
        run: |
          $scoopCore = Join-Path $env:RUNNER_TEMP "Scoop"
          git clone --depth 1 https://github.com/ScoopInstaller/Scoop.git $scoopCore
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Scoop core"
          }

      - name: Update manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scoopCore = Join-Path $env:RUNNER_TEMP "Scoop"
          $bucket = Join-Path $env:GITHUB_WORKSPACE "bucket"

          # 1. 更新所有支持 checkver 的 Manifest
          & "$scoopCore/bin/checkver.ps1" -Dir $bucket -Update -ThrowError

          if (-not $?) {
            throw "Scoop checkver failed."
          }

          Write-Host "Scoop checkver completed."

          # 2. 更新 RegCool SHA256
          $manifestPath = Join-Path $bucket "regcool.json"

          if (Test-Path $manifestPath) {
            Write-Host "Updating RegCool hash..."

            $manifest = Get-Content $manifestPath -Raw |
              ConvertFrom-Json

            $url = $manifest.architecture.'64bit'.url

            if ([string]::IsNullOrWhiteSpace($url)) {
              throw "RegCool download URL is missing."
            }

            $tempFile = Join-Path $env:RUNNER_TEMP "RegCoolX64.zip"

            Invoke-WebRequest -Uri $url -OutFile $tempFile

            $hash = (Get-FileHash $tempFile -Algorithm SHA256).Hash.ToLower()

            $manifest.architecture.'64bit'.hash = $hash

            $manifest |
              ConvertTo-Json -Depth 100 |
              Set-Content $manifestPath -Encoding utf8

            Write-Host "RegCool version: $($manifest.version)"
            Write-Host "RegCool SHA256: $hash"
          }

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE/bucket" -Filter "*.json" |
            ForEach-Object {
              try {
                Get-Content $_.FullName -Raw | ConvertFrom-Json -ErrorAction Stop |
                  Out-Null
              } catch {
                throw "Invalid manifest: $($_.Name) - $($_.Exception.Message)"
              }
            }

      - name: Commit and push updates
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed"
          }

          git add bucket

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No manifest updates."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Scoop manifests"
          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed"
          }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Git push failed"
          }
