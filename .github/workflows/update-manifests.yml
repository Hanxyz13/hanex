name: Update Scoop manifests

on:
  schedule:
    - cron: "0 20 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scoop-manifests
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout bucket
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get Scoop core
        shell: pwsh
        run: |
          $scoopCore = Join-Path $env:RUNNER_TEMP "Scoop"
          git clone --depth 1 https://github.com/ScoopInstaller/Scoop.git $scoopCore
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone Scoop core"
          }

      - name: Update manifests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $scoopCore = Join-Path $env:RUNNER_TEMP "Scoop"
          $bucket = Join-Path $env:GITHUB_WORKSPACE "bucket"

          # 1. 更新所有支持 checkver 的 Manifest
          & "$scoopCore/bin/checkver.ps1" -Dir $bucket -Update -ThrowError

          if (-not $?) {
            throw "Scoop checkver failed."
          }

          Write-Host "Scoop checkver completed."


          # 2. 统一更新各软件 SHA256

          function Update-ManifestHash {
            param(
              [string]$Name
            )

            $manifestPath = Join-Path $bucket "$Name.json"

            if (-not (Test-Path $manifestPath)) {
              throw "Manifest not found: $Name.json"
            }

            $manifest = Get-Content $manifestPath -Raw |
              ConvertFrom-Json

            # 自动识别下载地址所在位置
            if ($manifest.architecture -and $manifest.architecture.'64bit') {
              $target = $manifest.architecture.'64bit'
            } else {
              $target = $manifest
            }

            $url = $target.url

            if ([string]::IsNullOrWhiteSpace($url)) {
              throw "$Name download URL is missing."
            }

            Write-Host "Updating $Name SHA256..."

            $tempFile = Join-Path $env:RUNNER_TEMP "$Name.zip"

            Invoke-WebRequest -Uri $url -OutFile $tempFile

            $hash = (Get-FileHash $tempFile -Algorithm SHA256).Hash.ToLower()

            $target.hash = $hash

            $manifest |
              ConvertTo-Json -Depth 100 |
              Set-Content $manifestPath -Encoding utf8

            Write-Host "$Name version: $($manifest.version)"
            Write-Host "$Name SHA256: $hash"
          }

          # 依次更新四个软件
          Update-ManifestHash "regcool"
          Update-ManifestHash "natpierce"
          Update-ManifestHash "dart_simple_live"
          Update-ManifestHash "sing-box-refind"

      - name: Validate JSON manifests
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE/bucket" -Filter "*.json" |
            ForEach-Object {
              try {
                Get-Content $_.FullName -Raw | ConvertFrom-Json -ErrorAction Stop |
                  Out-Null
              } catch {
                throw "Invalid manifest: $($_.Name) - $($_.Exception.Message)"
              }
            }

      - name: Commit and push updates
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "git diff --check failed"
          }

          git add bucket

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No manifest updates."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $changedFiles = git diff --cached --name-only -- bucket

          $messages = foreach ($file in $changedFiles) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($file)
            $manifestPath = Join-Path $env:GITHUB_WORKSPACE $file

            try {
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              "${name}: Update to version $($manifest.version)"
            } catch {
              "${name}: Update manifest"
            }
          }

          $commitMessage = $messages -join "`n`n"

          git commit -m $commitMessage
          if ($LASTEXITCODE -ne 0) {
            throw "Git commit failed"
          }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw "Git push failed"
          }
